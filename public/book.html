<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bokdetaljer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-secondary bg-opacity-10">
    <main class="container my-4">
        <a href="index.html" class="btn btn-outline-secondary mb-4">Tillbaka till böcker</a>

        <p id="page-message" role="status"></p>

        <div id="book-page" hidden>
            <section class="row g-4 mb-5">
                <div class="col-md-4">
                    <img id="book-image" class="img-fluid rounded" alt="">
                </div>
                <div class="col-md-8">
                    <h1 id="book-title"></h1>
                    <p><strong>Författare:</strong> <span id="book-author"></span></p>
                    <p><strong>Publiceringsår:</strong> <span id="book-year"></span></p>
                    <p><strong>Genrer:</strong> <span id="book-genres"></span></p>
                    <p id="book-description"></p>
                </div>
            </section>

            <section class="mb-5">
                <h2>Skriv en recension</h2>
                <form id="review-form">
                    <div class="mb-3">
                        <label for="review-name" class="form-label">Namn</label>
                        <input id="review-name" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="review-content" class="form-label">Din recension</label>
                        <textarea id="review-content" class="form-control" rows="4" required></textarea>
                    </div>

                    <fieldset class="mb-3">
                        <legend class="fs-6">Betyg</legend>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating-1" value="1" required>
                            <label class="form-check-label" for="rating-1">1</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating-2" value="2" required>
                            <label class="form-check-label" for="rating-2">2</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating-3" value="3" required>
                            <label class="form-check-label" for="rating-3">3</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating-4" value="4" required>
                            <label class="form-check-label" for="rating-4">4</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rating" id="rating-5" value="5" required>
                            <label class="form-check-label" for="rating-5">5</label>
                        </div>
                    </fieldset>

                    <button id="review-submit" type="submit" class="btn btn-primary">Skicka recension</button>
                </form>
                <p id="review-message" class="mt-3" aria-live="polite"></p>
            </section>

            <section>
                <h2>Recensioner</h2>
                <div id="reviews-list"></div>
            </section>
        </div>
    </main>

    <script src="js/functions.js"></script>
    <script src="js/book.js"></script>
    <script src="js/review.js"></script>
</body>
</html>
