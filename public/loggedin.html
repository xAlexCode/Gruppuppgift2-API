<!-- Här är login sidan som man kommer åt efter man loggar in på login.html och man omderigeras till loggedin.html -->
<!--Added old protected page here -->
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-info bg-opacity-10">
   <nav class="navbar navbar-light bg-white shadow-sm px-3">
    <a class="navbar-brand fw-bold" href="index.html">Bokradar</a>

    <div>
      <button id="logoutBtn" class="btn btn-primary me-2">Logga ut</button>
    </div>
  </nav>

  <div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">
      <h1>Inloggad sida</h1>
    </div>

    <hr> <!-- Lärde mig att hr taggen ger en linje-->

    <h2>Böcker</h2>

    <!-- Tabell med böcker -->
    <table class="table table-striped table-bordered mt-3">
      <thead>
        <tr>
          <th>Titel</th>
          <th>Författare</th>
          <th>Genres</th>
          <th>År</th>
        </tr>
      </thead>
      <tbody id="booksTable"></tbody>
    </table>

    <hr>

    <h2>Lägg till ny bok</h2>

    <!-- Formulär för ny bok -->
    <form id="addBookForm" class="mt-3">
      <div class="mb-3">
        <label class="form-label">Titel</label>
        <input type="text" class="form-control" id="titleInput" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Författare</label>
        <input type="text" class="form-control" id="authorInput" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Genres (komma-separerade)</label>
        <input type="text" class="form-control" id="genresInput" required>
      </div>

      <div class="mb-3">
        <label class="form-label">År</label>
        <input type="number" class="form-control" id="yearInput" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Bild-URL</label>
        <input type="text" class="form-control" id="imageInput">
      </div>

      <button class="btn btn-success" type="submit">Lägg till bok</button>
    </form>

  </div>

 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/loggedin.js"></script>
  <script src="js/functions.js"></script>
  
</body>
</html>
