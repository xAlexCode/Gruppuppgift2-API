<!-- Här är login sidan som man kommer åt efter man loggar in på login.html och man omderigeras till loggedin.html -->
<!--Added old protected page here -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggad sida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-secondary bg-opacity-10">
  <nav class="navbar navbar-light bg-white shadow-sm px-3">
    <a class="navbar-brand fw-bold" href="index.html">Bokradar</a>

    <div>
      <button type="button" id="logoutBtn" class="btn btn-primary me-2">Logga ut</button>
    </div>
  </nav>
  <div class="container mt-4">

    <!-- Titel -->
    <div class="mb-4">
      <h1 class="fw-bold">Inloggad panel</h1>
      <p>Hantera böcker, användare och recensioner</p>
    </div>

    <!-- BÖCKER -->
    <div class="card mb-5 shadow-sm">
      <div class="card-body">
        <h2 class="card-title mb-3">Böcker</h2>

        <table class="table table-striped table-bordered">
          <thead class="table-primary">
            <tr>
              <th>Titel</th>
              <th>Författare</th>
              <th>Genres</th>
              <th>År</th>
            </tr>
          </thead>
          <tbody id="booksTable"></tbody>
        </table>

        <h3 class="mt-4">Lägg till ny bok</h3>

        <form id="addBookForm" class="mt-3">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Titel</label>
              <input type="text" class="form-control" id="titleInput" required>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Författare</label>
              <input type="text" class="form-control" id="authorInput" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Genres (komma-separerade)</label>
              <input type="text" class="form-control" id="genresInput" required>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">År</label>
              <input type="number" class="form-control" id="yearInput" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Bild-URL</label>
            <input type="text" class="form-control" id="imageInput">
          </div>

          <button type="submit" class="btn btn-success">Lägg till bok</button>
        </form>
      </div>
    </div>

    <!-- Users -->
    <div class="card mb-5 shadow-sm">
      <div class="card-body">
        <h2 class="card-title mb-3">Användare</h2>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="js/loggedin.js"></script>
  <script src="js/functions.js"></script>

</body>

</html>
